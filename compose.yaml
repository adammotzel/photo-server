---
name: photo-server

services:
  app:
    build:
      context: .
    # built and tagged only by scripts/build.sh, which sets PHOTO_SERVER_TAG (version-shortsha) in .env
    image: photo-server:${PHOTO_SERVER_TAG:?run scripts/build.sh first}
    restart: unless-stopped
    # time between SIGTERM and SIGKILL; must exceed timeout_graceful_shutdown
    # in scripts/run.py so background descriptions can finish on stop
    stop_grace_period: 100s
    env_file: .env
    environment:
      # Postgres runs on host (see docs/setup/01_POSTGRES.md)
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      # uploads persist on host
      - ./photos:/app/photos
      # certs on host, read-only
      - ./certs:/app/certs:ro
      # classifier weights on host, read-only
      - ./models:/app/models:ro
