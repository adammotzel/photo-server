---
name: photo-server

services:
  app:
    build: .
    image: photo-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Postgres runs on host (see docs/setup/POSTGRES.md)
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      # uploads persist on host
      - ./photos:/app/photos
      # certs on host, read-only
      - ./certs:/app/certs:ro
